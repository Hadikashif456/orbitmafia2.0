services:
  - type: web
    name: orbit-mafia-2-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/seed.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: DB_PATH
        value: /opt/render/project/src/data/orbit_mafia.db
      - key: PYTHON_VERSION
        value: 3.12.3
